name: Tests

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile application
        run: python -m compileall -q .
      - name: Install UI test dependencies
        run: python -m pip install 'streamlit==1.51.0' 'st-click-detector==0.1.3'
      - name: Eligibility and storage regressions
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unsaved draft and drawer lifecycle tests
        run: |
          npm install --prefix /tmp/staffpro-js-tests jsdom@26 --no-audit --no-fund
          NODE_PATH=/tmp/staffpro-js-tests/node_modules node --test tests/test_gantt_side_editor.cjs

  postgres:
    name: PostgreSQL transactions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: staffpro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/staffpro_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Atomic writes and concurrency against PostgreSQL
        run: python -m unittest discover -s tests -v
